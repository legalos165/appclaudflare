<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOGI LEGAL OS v3.0</title>
<style>
:root{--g:#0f5132;--bg:#f5f7f6;--bd:#dce5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#17221c}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--bd);padding:18px}.brand{font-size:19px;font-weight:bold;color:var(--g)}.nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#eaf5ef;color:var(--g);font-weight:bold}.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;padding:0 20px}.content{padding:22px;max-width:1450px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:18px 0}.card,.loginbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:17px}.metric{font-size:27px;font-weight:bold}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:#edf2ef;color:var(--g)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd6d0;border-radius:8px;font:inherit}label{display:block;font-size:12px;font-weight:bold;margin:9px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 14px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{background:#f4f7f5}.badge{padding:4px 8px;border-radius:99px;background:#eaf5ef;color:var(--g);font-size:11px}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(420px,92vw)}.error{color:#b42318}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;padding:22px;border-radius:14px;width:min(760px,96vw);max-height:90vh;overflow:auto}.toast{position:fixed;right:18px;bottom:18px;background:#17221c;color:#fff;padding:12px;border-radius:8px;z-index:9}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}}
</style></head><body>
<section id="login" class="login"><div class="loginbox">
<h1 style="color:#0f5132">YOGI LEGAL OS</h1><p>v3.0 • Cloudflare + Google Apps Script</p>
<div id="err" class="error"></div><label>Nama / Email</label><input id="identity">
<label>PIN</label><input id="secret" type="password"><button id="loginBtn" class="btn primary" style="width:100%;margin-top:12px">Masuk</button>
</div></section>
<section id="app" class="app" style="display:none"><aside class="side"><div class="brand">YOGI LEGAL OS</div><small>v3.0</small>
<div class="nav"><button data-r="dashboard">Dashboard</button><button data-r="leads">Leads</button><button data-r="clients">Clients</button><button data-r="conflict">Conflict Check</button><button data-r="matters">Matters</button><button data-r="tasks">Tasks & Deadlines</button><button data-r="retainers">Retainers</button><button data-r="documents">Documents</button><button data-r="billing">Billing</button><button data-r="audit">Audit Log</button><button data-r="settings">Settings</button></div></aside>
<main><header class="top"><b id="title">Dashboard</b><span id="user"></span> <button id="logout" class="btn secondary">Keluar</button></header><div id="content" class="content"></div></main></section>
<div id="modal"></div><div id="toast"></div>
<script>
const CONFIG={API_URL:"https://script.google.com/macros/s/AKfycbx8oiF08MUXhy0MrWyoUh_EUpcbxbHpP4MFu869RdJpKj8e4WSZbn3EUmH1c1ZtJ92U/exec"};
let SESSION=JSON.parse(sessionStorage.getItem("ylos")||"null");
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=x=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(+x||0);
const toast=x=>{let e=document.createElement("div");e.className="toast";e.textContent=x;$("#toast").append(e);setTimeout(()=>e.remove(),3000)};
const modal=x=>$("#modal").innerHTML='<div class="modalback"><div class="modal">'+x+"</div></div>",closeModal=()=>$("#modal").innerHTML="";
async function api(action,data={},method="POST"){
 if(CONFIG.API_URL.startsWith("PASTE_"))throw Error("Isi CONFIG.API_URL dengan URL Web App Apps Script.");
 let body={action,...data,...(SESSION?{token:SESSION.token}:{})};
 let r=await fetch(method==="GET"?CONFIG.API_URL+"?"+new URLSearchParams(body):CONFIG.API_URL,{method,headers:{"Content-Type":"text/plain;charset=utf-8"},body:method==="GET"?undefined:JSON.stringify(body)});
 let j=await r.json();if(!j.ok)throw Error(j.error||"Request gagal");return j.data;
}
async function login(){try{let d=await api("login",{identity:$("#identity").value,secret:$("#secret").value});SESSION=d;sessionStorage.setItem("ylos",JSON.stringify(d));start()}catch(e){$("#err").textContent=e.message}}
async function start(){if(!SESSION)return;try{await api("me");$("#login").style.display="none";$("#app").style.display="grid";$("#user").textContent=SESSION.user.name+" · "+SESSION.user.role;go(location.hash.replace("#/","")||"dashboard")}catch(e){sessionStorage.clear();SESSION=null}}
async function go(r){location.hash="#/"+r;$("#title").textContent=r.replace(/^\w/,x=>x.toUpperCase());try{await window[r]()}catch(e){$("#content").innerHTML="<div class=card>"+esc(e.message)+"</div>"}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.r));$("#loginBtn").onclick=login;$("#logout").onclick=()=>{sessionStorage.clear();location.reload()};window.onhashchange=()=>go(location.hash.replace("#/",""));
function head(t,b){return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><h1>'+t+'</h1>'+b+"</div>"}
async function dashboard(){let d=await api("dashboard","{}","GET");$("#content").innerHTML=head("Dashboard","")+'<div class=cards><div class=card>Clients<div class=metric>'+d.clients+'</div></div><div class=card>Matters<div class=metric>'+d.matters+'</div></div><div class=card>Retainers<div class=metric>'+d.retainers+'</div></div><div class=card>Open Tasks<div class=metric>'+d.tasks+'</div></div><div class=card>Monthly Retainer<div class=metric style="font-size:20px">'+money(d.monthlyRetainer)+'</div></div></div><div class=cards><div class=card>Deadline hari ini: <b>'+d.deadlinesToday+'</b><br>7 hari: <b>'+d.deadlines7+'</b></div><div class=card>Retainer alert: <b>'+esc(d.retainerAlert)+'</b></div></div>'}
async function tablePage(action,t,cols,add){
 let rows=await api(action,{},"GET");$("#content").innerHTML=head(t,'<button id=add class="btn primary">+ Tambah</button>')+'<div class=tablewrap><table><tr>'+cols.map(c=>"<th>"+c[0]+"</th>").join("")+"</tr>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+(c[2]?c[2](r[c[1]],r):esc(r[c[1]]))+"</td>").join("")+"</tr>").join("")+"</table></div>";$("#add").onclick=add}
function clients(){return tablePage("clients","Clients",[["ID","id"],["Nama","name"],["Jenis","type"],["Telepon","phone"],["Status","status"]],clientForm)}
function clientForm(){modal('<h2>Client</h2><form id=f><label>Nama</label><input name=name required><label>Jenis</label><select name=type><option>INDIVIDUAL</option><option>CORPORATE</option><option>GOVERNMENT</option></select><label>Email</label><input name=email><label>Telepon</label><input name=phone><label>Alamat</label><textarea name=address></textarea><button class="btn primary">Simpan</button></form>');$("#f").onsubmit=async e=>{e.preventDefault();try{await api("createClient",Object.fromEntries(new FormData(e.target)));closeModal();clients()}catch(x){toast(x.message)}}}
function leads(){return tablePage("leads","Leads",[["ID","id"],["Nama","name"],["Source","source"],["Status","status"]],()=>{modal('<h2>Lead</h2><form id=f><label>Nama</label><input name=name required><label>Telepon</label><input name=phone><label>Source</label><input name=source><button class="btn primary">Simpan</button></form>');$("#f").onsubmit=async e=>{e.preventDefault();await api("createLead",Object.fromEntries(new FormData(e.target)));closeModal();leads()}})}
function matters(){return tablePage("matters","Matters",[["ID","id"],["Client","client_id"],["Judul","title"],["Area","practice_area"],["Priority","priority"],["Status","status"]],()=>{modal('<h2>Matter</h2><form id=f><label>Client ID</label><input name=client_id required><label>Judul</label><input name=title required><label>Area</label><input name=practice_area><label>Priority</label><select name=priority><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><textarea name=description placeholder="Deskripsi"></textarea><button class="btn primary">Simpan</button></form>');$("#f").onsubmit=async e=>{e.preventDefault();try{await api("createMatter",Object.fromEntries(new FormData(e.target)));closeModal();matters()}catch(x){toast(x.message)}}})}
function tasks(){return tablePage("tasks","Tasks & Deadlines",[["ID","id"],["Task","title"],["Matter","matter_id"],["Due","due_date"],["Priority","priority"],["Status","status"]],()=>{modal('<h2>Task</h2><form id=f><label>Judul</label><input name=title required><label>Matter ID</label><input name=matter_id><label>Due</label><input name=due_date type=datetime-local><label>Priority</label><select name=priority><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><button class="btn primary">Simpan</button></form>');$("#f").onsubmit=async e=>{e.preventDefault();await api("createTask",Object.fromEntries(new FormData(e.target)));closeModal();tasks()}})}
function retainers(){return tablePage("retainers","Retainers",[["ID","id"],["Client","client_id"],["Package","package"],["Fee","monthly_fee",money],["Limit","credit_limit"],["Used","credit_used"],["Balance","balance"],["Status","status"]],()=>{modal('<h2>Retainer</h2><form id=f><label>Client ID</label><input name=client_id required><label>Package</label><input name=package required><label>Monthly Fee</label><input name=monthly_fee type=number><label>Credit Limit</label><input name=credit_limit type=number required><label>Start</label><input name=start_date type=date><label>End</label><input name=end_date type=date><button class="btn primary">Simpan</button></form>');$("#f").onsubmit=async e=>{e.preventDefault();await api("createRetainer",Object.fromEntries(new FormData(e.target)));closeModal();retainers()}})}
async function conflict(){$("#content").innerHTML=head("Conflict Check","")+'<div class=card><form id=f><label>Nama pihak</label><input name=name required><button class="btn primary">Periksa</button></form><div id=res></div></div>';$("#f").onsubmit=async e=>{e.preventDefault();let d=await api("conflictCheck",{name:new FormData(e.target).get("name")});$("#res").innerHTML="<hr><h3>"+(d.conflict?"POTENTIAL CONFLICT":"CLEAR")+"</h3><p>"+esc(d.message)+"</p>"}}
async function documents(){let rows=await api("documents",{},"GET");$("#content").innerHTML=head("Documents","")+'<div class=card><form id=f><label>Client ID</label><input name=client_id required><label>Matter ID</label><input name=matter_id><label>Jenis Dokumen</label><input name=document_type><label>File</label><input name=file type=file required><button class="btn primary">Upload</button></form></div><div class=tablewrap style="margin-top:15px"><table><tr><th>ID</th><th>File</th><th>Client</th><th>Matter</th><th>Created</th></tr>'+rows.map(r=>"<tr><td>"+esc(r.id)+"</td><td>"+esc(r.file_name)+"</td><td>"+esc(r.client_id)+"</td><td>"+esc(r.matter_id)+"</td><td>"+esc(r.created_at)+"</td></tr>").join("")+"</table></div>";$("#f").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get("file");if(file.size>10*1024*1024)return toast("MVP maksimal 10MB/file");let b=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(file)});try{await api("uploadDocument",{client_id:f.get("client_id"),matter_id:f.get("matter_id"),document_type:f.get("document_type"),file_name:file.name,mime_type:file.type,file_base64:b});toast("Upload berhasil");documents()}catch(x){toast(x.message)}}}
function billing(){return tablePage("billing","Billing",[["Invoice","invoice_number"],["Client","client_id"],["Amount","amount",money],["Due","due_date"],["Status","status"]],()=>{modal('<h2>Invoice</h2><form id=f><label>Client ID</label><input name=client_id required><label>Retainer ID</label><input name=retainer_id><label>Amount</label><input name=amount type=number required><label>Due</label><input name=due_date type=date><textarea name=description placeholder="Description"></textarea><button class="btn primary">Simpan</button></form>');$("#f").onsubmit=async e=>{e.preventDefault();await api("createInvoice",Object.fromEntries(new FormData(e.target)));closeModal();billing()}})}
function audit(){return tablePage("audit","Audit Log",[["Time","created_at"],["User","user_id"],["Action","action"],["Module","module"],["Record","record_id"],["Description","description"]],()=>toast("Audit dibuat otomatis."))}
async function settings(){$("#content").innerHTML=head("Settings","")+'<div class=card><b>User:</b> '+esc(SESSION.user.name)+'<br><b>Role:</b> '+esc(SESSION.user.role)+'<hr><b>API:</b><br>'+esc(CONFIG.API_URL)+'</div>'}
start();
</script></body></html>
